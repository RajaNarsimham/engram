[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram"
version = "0.0.1"
description = "A continual-learning harness for open-weight LLMs (base + skill-LoRAs + RAG + consolidation)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Engram contributors" }]
keywords = ["llm", "continual-learning", "lora", "rag", "agents", "peft", "orchestration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core stays light; backends/capabilities are optional extras so a base install is small.
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
peft = ["torch>=2.3", "transformers>=4.45", "peft>=0.12", "accelerate>=0.30"]
rag = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0"]
aws = ["boto3>=1.34"]
vllm = ["vllm>=0.6"]
dev = ["pytest>=8.0", "ruff>=0.6", "moto[s3,dynamodb]>=5.0"]
all = ["engram[peft,rag,serve,aws]"]

[project.urls]
Homepage = "https://github.com/RajaNarsimham/engram"
Documentation = "https://github.com/RajaNarsimham/engram/tree/main/docs"
Issues = "https://github.com/RajaNarsimham/engram/issues"

[project.scripts]
engram = "engram.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.ruff]
line-length = 100
target-version = "py310"
